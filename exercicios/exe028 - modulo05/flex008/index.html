<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            padding: 10px;  
            border-radius: 10px;            
            height: 400px;
            
            display: flex;
            flex-flow: row nowrap; 
            align-items: flex-start;            
        }

        div.item {
            background-color: cadetblue; 
            border: 1px solid black;              
            text-align: center;  
            padding: 20px; 
            margin-right: 5px;  
            border-radius: 10px;                    
        }       

        #i1 {           
            align-self: auto;
        }

        #i2{
            align-self: flex-start;
        }

        #i3 {
            align-self: flex-end;
        }

        #i4 {
            align-self: center;
        }

        #i5 {
            align-self: stretch;
        }

         

        


    </style>
</head>
<body>
    Exemplo "align-self"
    <div class="container"> <!-- Div Pai -->
        <div class="item" id="i1">1</div>
        <div class="item" id="i2">2</div>
        <div class="item" id="i3">3</div>
        <div class="item" id="i4">4</div>
        <div class="item" id="i5">5</div>        
    </div>  
</body>
</html>
