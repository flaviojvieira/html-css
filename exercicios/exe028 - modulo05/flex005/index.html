<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Centralizado</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: salmon;
        }
        
        div.container {
            background-color: blue;            
            width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 10px; 

            /* fexbox */
            display: flex;
            justify-content: center;
            align-items: center;
                       
        }

        div.item {
            background-color: cadetblue;
            width: 200px;
            height: 400px;
            border-radius: 10px;
        }   
        
        main {
            background-color: lightgreen;
            width: 90vw;
            height: 90vh;   
            margin: auto;
           
            /* flexbox*/
            display: flex;  
            flex-flow: row nowrap;
            justify-content: center;    
            align-items: center;               
        }

        section {
            background-color: cadetblue;
            height: 200px;
            width: 200px;           
        }
    </style>
</head>
<body>          
    <div class="container"> <!-- Div Pai -->
        <div class="item"></div>           
    </div> <br> <br>

    <main>
        <section>
            <h1>Tela de Login</h1>
        </section>
    </main>
</html>
