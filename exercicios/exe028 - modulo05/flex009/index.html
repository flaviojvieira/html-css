<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            padding: 5px; 

            display: flex;
            flex-flow: row nowrap;
                       
        }

        div.item {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: auto;
        }

        div.item2 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 50px;
        }

        div.item3 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 100px;
        }

        div.item4 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 150px;
        }

         div.item5 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 200px;
        }

           div.item6 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 250px;
        }

             div.item6 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 300px;
        }

             div.item7 {
            background-color: cadetblue; 
            border: 1px solid black;                
            text-align: center;  
            padding: 20px; 
            
            flex-basis: 300px;
        }

    </style>
</head>
<body>
    flex-basis (lembrando que é flexível e ele vai se adaptando)
    <div class="container"> <!-- Div Pai -->
        <div class="item">A<br>auto</div>
        <div class="item2">B<br>50px</div>
        <div class="item3">C<br>100px</div>
        <div class="item4">D<br>150px</div>
        <div class="item5">E<br>200px</div>
        <div class="item6">F<br>250px</div>
        <div class="item7">G<br>300px</div>
    </div>
</body>
</html>
