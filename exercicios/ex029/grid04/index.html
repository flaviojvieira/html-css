<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Áreas</title>
    <style>

        body {
            background-color: cadetblue;
        }
        .container {    
                 
            display: grid;  
            gap: 5px;          
            grid-template-rows: repeat(7, 100px);             
            grid-template-columns: repeat(6, 1fr);              
        }

        div {            
            text-align: center;            
            font-size: 1.2em;
            border: 1px solid black;
        }

        .item {
            border: 1px solid black;
            text-align: center;
            padding: 5px;                       
        }

        .caixa1 {            
            background-color: white;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 7;            
        }

        .caixa2 {
            background-color: white;
            grid-row-start: 2;
            grid-row-end: 6;
            grid-column-start: 1;
            grid-column-end: 3;         
        }

        .caixa3 {
            background-color: white;
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;          
        }   

        .caixa4 {
            background-color: white; 
            grid-row-start: 4;
            grid-row-end: 6;
            grid-column-start: 3;
            grid-column-end: 5; 
        }
        
        .caixa5 {           
            background-color: white;
            grid-row-start: 2;
            grid-row-end: 6;
            grid-column-start: 5;
            grid-column-end: 7;
           
        }

        .caixa6 {
            background-color: white;
            grid-row-start: 6;
            grid-row-end: 8;
            grid-column-start: 1;
            grid-column-end: 8;
        }
       

    </style>
</head>
<body>
    <main class="container">
        <div class="caixa1">header</div>
        <div class="caixa2">nav</div>
        <div class="caixa3">section</div> 
        <div class="caixa4">section</div> 
        <div class="caixa5">aside</div>
        <div class="caixa6">footer</div>                           
    </main>
</body>
</html>
