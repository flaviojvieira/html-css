<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Teste de Grid</title>
    <style>  
        body {
            background-color: cadetblue;
        }

        div {
            border: 3px solid black;
            background-color: white;
        }

        .grid {
            width: 80%;
            margin: auto;
            display: grid;
            gap: 5px;
            grid-template: repeat(8, 100px) / repeat(6, 1fr);
        }        

        .item1 {             
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 7;
        }

        .item2 {           
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: 7;
        }

        .item3 {            
            grid-row-start: 3;
            grid-row-end: 7;
            grid-column-start: 1;
            grid-column-end: 4;
        }

        .item4 {            
            grid-row-start: 3;
            grid-row-end: 5;
            grid-column-start: 4;
            grid-column-end: 7;
        }

        .item5 {            
            grid-row-start: 5;
            grid-row-end: 7;
            grid-column-start: 4;
            grid-column-end: 7;
        }

        .item6 {            
            grid-row-start: 7;
            grid-row-end: 9;
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .item7 {            
            grid-row-start: 7;
            grid-row-end: 9;
            grid-column-start: 3;
            grid-column-end: 5;
        }

        .item8 {            
            grid-row-start: 7;
            grid-row-end: 9;
            grid-column-start: 5;
            grid-column-end: 7;
        }

    </style>
</head>
<body>
    <main class="grid">
        <div class="item1">secão 1</div>
        <div class="item2">secão 2</div>
        <div class="item3">secão 3</div>
        <div class="item4">secão 4</div>
        <div class="item5">secão 5</div>
        <div class="item6">secão 6</div>
        <div class="item7">secão 7</div>
        <div class="item8">secão 8</div>
    </main>
</body>
</html>
