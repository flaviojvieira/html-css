<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário-006</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Escola Sua Cor</legend>
            <p>
                <label for="icor">Cor</label>
                <input type="color" name="cor" id="icor" value="#00FF00">
            </p>
        </fieldset> <br>
        <fieldset>
            <legend>Qual Seu Nível de Satisfação</legend>
            <p>
                <label for="inivel">Escolha de 1 a 10</label>
                <input type="range" name="nivel" id="inivel" min="1" max="10" value="8">
            </p>
        </fieldset> <br>
        <fieldset>
            <legend>Insira Uma Foto</legend>
            <p>
                <label for="ifoto">Foto do Perfil</label>
                <input type="file" name="foto" id="ifoto">
            </p>
        </fieldset> <br>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
