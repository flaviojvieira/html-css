<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container {
            background-color: blue;
            padding: 5px; 
            display: flex;
            flex-flow: row nowrap; 
        }

        div.item {
            background-color: cadetblue; 
            border: 1px solid black;              
            text-align: center;  
            padding: 20px;
            align-self: auto;             
        }

       

        #i1 {
            order: -1;
            align-self: auto;
        }

          #i2{
            order: -5;
        }

          #i3 {
            order: 5;
        }

          #i4 {
            order: 2;
        }

          #i5 {
            order: 0;
        }

          #i6 {
            order: 0;
        }

          #i7 {
            order: -3;
        }

        


    </style>
</head>
<body>
    Exemplo "order"
    <div class="container"> <!-- Div Pai -->
        <div class="item" id="i1">1</div>
        <div class="item" id="i2">2</div>
        <div class="item" id="i3">3</div>
        <div class="item" id="i4">4</div>
        <div class="item" id="i5">5</div>
        <div class="item" id="i6">6</div>
        <div class="item" id="i7">7</div>
    </div>  
</body>
</html>
