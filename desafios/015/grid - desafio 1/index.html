<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Teste de Grid</title>
    <style>  
        body {
            background-color: cadetblue;
        }

        div {
            border: 3px solid black;
            background-color: white;
            text-align: center;
        }

        .grid {
            width: 80%;
            margin: auto;
            display: grid;
            gap: 5px;
            grid-template: repeat(9, 100px) / repeat(6, 1fr);
        }        

        .item1 {  
            grid-area: 1 / 1 / 2 / 7;
        }    

        .item2 { 
            grid-area: 2 / 1 / 3 / 7;
        }

        .item3 {           
            grid-area: 3 / 1 / 7 / 4;
        }

        .item4 {             
            grid-area: 3 / 4 / 5 / 7;
        }

        .item5 { 
            grid-area: 5 / 4 / 7 / 7;
        }

        .item6 { 
            grid-area: 7 / 1 / 9 / 3;
        }

        .item7 {  
            grid-area: 7 / 3 / 9 / 5;
        }

        .item8 { 
            grid-area: 7 / 5 / 9 / 7;
        }

        .item9 {
            grid-area: 9 / 1 / 10 / 7;
        }

    </style>
</head>
<body>
    <main class="grid">
        <div class="item1">Topo</div>
        <div class="item2">Menu</div>
        <div class="item3">Principal 1</div>
        <div class="item4">Principal 2</div>
        <div class="item5">Principal 3</div>
        <div class="item6">Secundario 1</div>
        <div class="item7">Secundario 2</div>
        <div class="item8">Secundario 3</div>
        <div class="item9">Rodape</div>
    </main>
</body>
</html>
